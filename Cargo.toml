[package]
name = "onus"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.19"
# Content-as-data: unit/economy definitions deserialize from assets/data/*.ron
# into render-free sim structs (src/sim/content.rs).
serde = { version = "1", features = ["derive"] }
ron = "0.8"

# Fast dev rebuilds (dev only): `cargo run --features bevy/dynamic_linking`
# Pair with the `mold` linker on Linux for best iteration times.

[dev-dependencies]
criterion = "0.5"

# L4 performance benches (criterion). Run with `cargo bench`.
[[bench]]
name = "movement"
harness = false

[[bench]]
name = "nearest_enemy"
harness = false

[[bench]]
name = "pathfind"
harness = false

# M5: the cost of a tick with and without per-tick state hashing.
[[bench]]
name = "replay_hash"
harness = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
